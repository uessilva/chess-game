[project]
name = "chess-ml"
version = "0.1.0"
description = "Offline data pipeline and training sidecar for the chess game"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.5,<3",
  "python-chess>=1.999,<2",
]

[project.scripts]
ml-download = "chess_ml.cli:download_main"
ml-build = "chess_ml.cli:build_main"
ml-stats = "chess_ml.cli:stats_main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
# Torch is pinned to the CPU wheel index (no CUDA payload). It is only used
# from 4.2 onwards; the pipeline itself never imports it. It lives in its own
# group so CI can skip the ~200 MB download (uv sync --no-group train).
train = [
  "torch==2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_ml"]

[tool.uv]
default-groups = ["dev", "train"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
