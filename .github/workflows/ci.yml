name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Fast perft tier (all six CPW fixtures) runs every PR. The heavy
      # runs (~16.5M nodes) overflow V8's 32-bit coverage counters, so the
      # fixtures run here without instrumentation; the coverage-gated
      # suite below excludes them (see the test:coverage script).
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:modules
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
